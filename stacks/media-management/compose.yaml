name: media-management
networks: { media: { external: true } }
x-common: &common
  networks: [media]
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
services:
  prowlarr:
    <<: *common
    image: lscr.io/linuxserver/prowlarr:2.6.5
    container_name: prowlarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      UMASK: "002"
    volumes: ["${APPDATA:-/opt/appdata}/prowlarr:/config"]
    ports: ["9696:9696"]
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:9696/ping"], interval: 60s, timeout: 10s, retries: 3, start_period: 60s }
  sonarr:
    <<: *common
    image: lscr.io/linuxserver/sonarr:4.0.20
    container_name: sonarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      UMASK: "002"
    volumes:
      - ${APPDATA:-/opt/appdata}/sonarr:/config
      - type: bind
        source: ${MEDIA_DATA:-/srv/media/data}
        target: /data
        bind: { create_host_path: false }
    ports: ["8989:8989"]
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8989/ping"], interval: 60s, timeout: 10s, retries: 3, start_period: 60s }
  radarr:
    <<: *common
    image: lscr.io/linuxserver/radarr:6.4.4
    container_name: radarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      UMASK: "002"
    volumes:
      - ${APPDATA:-/opt/appdata}/radarr:/config
      - type: bind
        source: ${MEDIA_DATA:-/srv/media/data}
        target: /data
        bind: { create_host_path: false }
    ports: ["7878:7878"]
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:7878/ping"], interval: 60s, timeout: 10s, retries: 3, start_period: 60s }
  bazarr:
    <<: *common
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls371
    container_name: bazarr
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      UMASK: "002"
    volumes:
      - ${APPDATA:-/opt/appdata}/bazarr:/config
      - type: bind
        source: ${MEDIA_DATA:-/srv/media/data}
        target: /data
        bind: { create_host_path: false }
    ports: ["6767:6767"]
    healthcheck: { test: ["CMD", "curl", "-fs", "-o", "/dev/null", "http://localhost:6767"], interval: 60s, timeout: 10s, retries: 3, start_period: 90s }
