# Cloud-Stack: Nextcloud, Paperless-ngx, Obsidian-LiveSync (CouchDB), Guacamole. Secrets in .env (chmod 600).
name: cloud
x-common: &common
  restart: unless-stopped
  networks: [cloud]

services:
  postgres:
    <<: *common
    image: postgres:18.6-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NEXTCLOUD_DB_PASS: ${NEXTCLOUD_DB_PASS}
      PAPERLESS_DB_PASS: ${PAPERLESS_DB_PASS}
      GUACAMOLE_DB_PASS: ${GUACAMOLE_DB_PASS}
    volumes:
      - ${APPDATA:-/opt/appdata}/postgres:/var/lib/postgresql
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      retries: 10
    mem_limit: 384m

  redis:
    <<: *common
    image: redis:8.10.3-alpine
    container_name: redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction", "--save", "300", "10"]
    volumes:
      - ${APPDATA:-/opt/appdata}/redis:/data
    mem_limit: 128m

  nextcloud:
    <<: *common
    image: nextcloud:35.0.2-apache
    container_name: nextcloud
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASS}
      NEXTCLOUD_ADMIN_USER: ${ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD}
      NEXTCLOUD_TRUSTED_DOMAINS: nextcloud.local ${HOST_IP}
      REDIS_HOST: redis
      REDIS_HOST_PASSWORD: ${REDIS_PASSWORD}
      PHP_MEMORY_LIMIT: 512M
      PHP_UPLOAD_LIMIT: 10G
      APACHE_BODY_LIMIT: "0"
      TRUSTED_PROXIES: 172.16.0.0/12
      OVERWRITEPROTOCOL: http
    volumes:
      - ${APPDATA:-/opt/appdata}/nextcloud:/var/www/html
      - ${CLOUD_DATA:-/srv/data}/nextcloud:/var/www/html/data
    mem_limit: 768m

  paperless:
    <<: *common
    image: ghcr.io/paperless-ngx/paperless-ngx:3.4.2
    container_name: paperless
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASS}
      PAPERLESS_REDIS: redis://:${REDIS_PASSWORD}@redis:6379/1
      PAPERLESS_REDIS_PREFIX: paperless
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: http://paperless.local
      PAPERLESS_ALLOWED_HOSTS: paperless.local,${HOST_IP},localhost
      PAPERLESS_CSRF_TRUSTED_ORIGINS: http://paperless.local
      PAPERLESS_ADMIN_USER: ${ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
      PAPERLESS_TIME_ZONE: Europe/Berlin
      PAPERLESS_OCR_LANGUAGE: deu+eng
      # files dropped into Nextcloud "Paperless-Inbox" are written by www-data (uid 33)
      USERMAP_UID: "33"
      USERMAP_GID: "33"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      # wenig RAM: 1 Worker reicht für ein Homelab
      PAPERLESS_TASK_WORKERS: "1"
      PAPERLESS_THREADS_PER_WORKER: "1"
      PAPERLESS_WEBSERVER_WORKERS: "1"
    volumes:
      - ${APPDATA:-/opt/appdata}/paperless/data:/usr/src/paperless/data
      - ${CLOUD_DATA:-/srv/data}/paperless/media:/usr/src/paperless/media
      - ${CLOUD_DATA:-/srv/data}/paperless/export:/usr/src/paperless/export
      - ${CLOUD_DATA:-/srv/data}/nextcloud/${ADMIN_USER:-admin}/files/Paperless-Inbox:/usr/src/paperless/consume
    mem_limit: 1280m

  couchdb:
    <<: *common
    image: couchdb:3.5.3
    container_name: couchdb
    environment:
      COUCHDB_USER: obsidian
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - ${APPDATA:-/opt/appdata}/couchdb/data:/opt/couchdb/data
      - ${APPDATA:-/opt/appdata}/couchdb/etc:/opt/couchdb/etc/local.d   # obsidian.ini copied here at setup (CouchDB must own it)
    mem_limit: 256m

  guacd:
    <<: *common
    image: guacamole/guacd:1.6.0
    container_name: guacd
    mem_limit: 256m

  guacamole:
    <<: *common
    image: guacamole/guacamole:1.6.0
    container_name: guacamole
    depends_on:
      postgres: { condition: service_healthy }
      guacd: { condition: service_started }
    environment:
      GUACD_HOSTNAME: guacd
      POSTGRESQL_HOSTNAME: postgres
      POSTGRESQL_DATABASE: guacamole
      POSTGRESQL_USERNAME: guacamole
      POSTGRESQL_PASSWORD: ${GUACAMOLE_DB_PASS}
      TOTP_ENABLED: "true"
      WEBAPP_CONTEXT: ROOT
      JAVA_OPTS: -Xmx192m
    mem_limit: 384m

  caddy:
    <<: *common
    image: caddy:2.11.9
    container_name: caddy
    environment:
      HOST_IP: ${HOST_IP}
    ports:
      - "${CLOUD_HTTP_PORT:-80}:80"   # eigener Server: 80 · gleicher Host wie der proxy-Stack: 8081
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APPDATA:-/opt/appdata}/caddy/data:/data
      - ${APPDATA:-/opt/appdata}/caddy/config:/config
    mem_limit: 96m

networks:
  cloud:
    name: cloud
