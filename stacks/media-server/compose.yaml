name: media-server
networks: { media: { external: true } }
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:version-12.1ubu2604
    container_name: jellyfin
    cpus: ${JELLYFIN_CPUS:-4}  # Katalog-Importe (Gelato) sind CPU-hungrig – auf kleinen Hosts begrenzen
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Europe/Berlin}
      UMASK: "002"
      JELLYFIN_PublishedServerUrl: http://${HOST_IP}:8096
    volumes:
      - ${APPDATA:-/opt/appdata}/jellyfin:/config
      - type: bind
        source: ${MEDIA_DATA:-/srv/media/data}
        target: /data
        bind: { create_host_path: false }
    ports: ["8096:8096", "7359:7359/udp"]
    networks: [media]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8096/health"], interval: 60s, timeout: 10s, retries: 3, start_period: 120s }
  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.0
    container_name: seerr
    init: true
    environment:
      TZ: ${TZ:-Europe/Berlin}
      PORT: "5055"
      LOG_LEVEL: info
    volumes: ["${APPDATA:-/opt/appdata}/seerr:/app/config"]
    ports: ["5055:5055"]
    networks: [media]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    healthcheck: { test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:5055/api/v1/settings/public || exit 1"], interval: 60s, timeout: 10s, retries: 3, start_period: 60s }
