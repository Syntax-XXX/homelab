name: proxy
services:
  caddy:
    image: caddy:2.10.2
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${APPDATA:-/opt/appdata}/caddy/data:/data
      - ${APPDATA:-/opt/appdata}/caddy/config:/config
